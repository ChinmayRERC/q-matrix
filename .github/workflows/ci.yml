name: CI

# Runs the web and API suites on every push and pull request, on both the
# personal repository and the VTU organisation mirror. The Pages workflow only
# builds, so without this a broken test could ship.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Fail if a provider key reached the bundle
        run: |
          if grep -rEl 'nvapi-[A-Za-z0-9_-]{20,}|sk-ant-[A-Za-z0-9_-]{20,}' dist; then
            echo "::error::A provider API key is present in dist/. Remove it before deploying."
            exit 1
          fi

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r apps/api/requirements.txt
      - name: API tests
        run: python -m pytest apps/api -q
